<!DOCTYPE html>
<html lang="en" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout.html}">
<head>
</head>
<body>

<div class="container" layout:fragment="content">
    <h1 class="mb-3">Welcome, <span th:text="${user.username}"></span></h1>

    <h4>You are logged in</h4>

    <table class="mb-4">
        <tr>
            <td>
                <a th:href="@{/user/editUser/{id}(id=${user.id})}" class="btn btn-primary">Edit</a>
            </td>
            <td style="padding-left: 20px;">
                <form th:action="@{/logout}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-outline-primary">Sign Out</button>
                </form>
            </td>
        </tr>
    </table>


    <h3>Recent Posts</h3>

    <a href="/home/newPost" class="btn btn-success mb-4">Create Post</a>

    <div th:if="${#lists.isEmpty(posts)}">
        <p>No posts available</p>
    </div>


    <div th:if="${!#lists.isEmpty(posts)}">
    <div th:each="post : ${posts}" class="card mb-3">
        <div class="card-body">
            <h5 class="card-title" th:text="${post.title}"></h5>
            <p class="card-text" th:text="${post.content}"></p>
            <p class="text-muted">By <span th:text="${post.createdBy.getUsername()}"></span> on <span th:text="${post.createdAt}"></span></p>

            <!-- Przycisk Edytuj -->
            <a th:href="@{/home/editPost/{id}(id=${post.id})}" class="btn btn-primary">Edit</a>

            <!-- Przycisk Usuń -->
            <form th:action="@{/home/deletePost/{id}(id=${post.id})}" method="post" style="display:inline;">
                <button type="submit" class="btn btn-danger" onclick="return confirm('Are you sure you want to delete this post?');">Delete</button>
            </form>

        </div>
    </div>
    </div>
</div>
</body>
</html>
